<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Data Visualisation Dashboard</title>

    <script src="lib/p5.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <script src="src/helper-functions.js"></script>

    <script src="src/pie-chart.js"></script>

    <script src="src/gallery.js"></script>


    <script src="src/visualizations/sa-population-group-census.js"></script>
    <script src="src/visualizations/sa-sex-age-2022.js"></script>
    <script src="src/visualizations/sa-age-sex-bubble-2022.js"></script>
    <script src="src/visualizations/sa-youth-unemployment.js"></script>
    <script src="src/visualizations/climate-change.js"></script>

    <script src="src/sketch.js"></script>
  </head>

  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Dataset navigation">
        <h2 class="sidebar-title">Datasets</h2>
        <nav id="visuals-menu" class="visuals-menu" aria-label="Visualisations"></nav>
      </aside>

      <main class="main-content">
        <header class="page-header">
          <h1>Data Visualisation Dashboard</h1>
        </header>

        <section id="overview" class="overview" aria-labelledby="overview-title">
          <div class="section-heading">
            <h2 id="overview-title">Overview</h2>
            <p>Select a dataset to view the corresponding visualisation.</p>
          </div>
          <div id="overview-cards" class="card-grid"></div>
        </section>

        <section id="chart-view" class="chart-view hidden" aria-label="Chart view">
          <div class="chart-layout">
            <article class="chart-card" aria-label="Chart display">
              <div class="chart-header">
                <h2 id="chart-title">Chart</h2>
                <div id="chart-controls" class="chart-controls"></div>
              </div>
              <div id="chart-container" class="chart-container"></div>
              <p id="chart-source" class="chart-source"></p>
            </article>

            <aside class="info-panel" aria-label="Chart information">
              <h2 id="info-title">Information</h2>

              <h3>What this shows</h3>
              <p id="info-shows"></p>

              <h3>Key finding</h3>
              <p id="info-finding"></p>

              <h3>Source</h3>
              <p id="info-source"></p>
            </aside>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
