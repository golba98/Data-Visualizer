<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Visualisation Dashboard</title>

    <!-- Libraries -->
    <script src="lib/p5.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <!-- Utilities: shared data processing and drawing helpers -->
    <script src="src/helper-functions.js"></script>

    <!-- Components: reusable chart types -->
    <script src="src/pie-chart.js"></script>

    <!-- Gallery: manages the visualisation menu and lifecycle -->
    <script src="src/gallery.js"></script>

    <!-- Visualisations: one file per dataset/chart -->
    <script src="src/visualizations/tech-diversity-race.js"></script>
    <script src="src/visualizations/tech-diversity-gender.js"></script>
    <script src="src/visualizations/pay-gap-by-job-2017.js"></script>
    <script src="src/visualizations/pay-gap-1997-2017.js"></script>
    <script src="src/visualizations/climate-change.js"></script>

    <!-- Entry point: p5.js setup() and draw() -->
    <script src="src/sketch.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Dataset navigation">
        <h2 class="sidebar-title">Datasets</h2>
        <nav id="visuals-menu" class="visuals-menu" aria-label="Visualisations"></nav>
      </aside>

      <main class="main-content">
        <header class="page-header">
          <h1>Data Visualisation Dashboard</h1>
        </header>

        <section id="overview" class="overview" aria-labelledby="overview-title">
          <div class="section-heading">
            <h2 id="overview-title">Overview</h2>
            <p>Select a dataset to view the corresponding visualisation.</p>
          </div>
          <div id="overview-cards" class="card-grid"></div>
        </section>

        <section id="chart-view" class="chart-view hidden" aria-labelledby="chart-title">
          <div class="chart-layout">
            <article class="chart-card" aria-label="Chart display">
              <div class="chart-header">
                <h2 id="chart-title"></h2>
                <div id="chart-controls" class="chart-controls"></div>
              </div>
              <div id="chart-container" class="chart-container"></div>
            </article>

            <aside class="info-panel" aria-label="Chart information">
              <h2 id="info-title"></h2>

              <h3>What this shows</h3>
              <p id="info-shows"></p>

              <h3>Key finding</h3>
              <p id="info-finding"></p>

              <h3>Source</h3>
              <p id="info-source"></p>
            </aside>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
